[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "offline-payment-sim"
version = "0.1.0"
description = "Hybrid Offline Payment Research Simulator with Payer-Liable Settlement and Blockchain Audit Anchoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "py-solc-x>=2.1.0",
    "web3>=8.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/offline_payment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
